# KORA Development Environment Override
# ======================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Development-specific settings:
# - Hot reload for API and web
# - Debug logging
# - Exposed ports for direct access
# - Volume mounts for live code changes

services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./api/src:/app/src:ro
    command: ["npm", "run", "dev"]

  optimizer:
    environment:
      KORA_LOG_LEVEL: DEBUG
      KORA_CACHE_ENABLED: "false"
    volumes:
      - ./python-optimizer:/app:ro
      - optimizer_cache:/app/cache
    command: ["--run-once", "--log-level", "DEBUG"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./web/src:/app/src:ro
      - ./web/index.html:/app/index.html:ro
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    profiles: []  # Always include in dev
