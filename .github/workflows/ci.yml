# KORA CI/CD Pipeline
# ====================
# Runs tests, builds containers, and deploys to staging/production

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Test Python Optimizer
  # ============================================================================
  test-optimizer:
    name: Test Optimizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-optimizer/requirements.txt'

      - name: Install dependencies
        working-directory: python-optimizer
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: python-optimizer
        run: |
          pytest tests/ -v --cov=kora --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: python-optimizer/coverage.xml
          flags: optimizer
          fail_ci_if_error: false

  # ============================================================================
  # Test API
  # ============================================================================
  test-api:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'api/package-lock.json'

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Run linter
        working-directory: api
        run: npm run lint --if-present

      - name: Run tests
        working-directory: api
        run: npm test --if-present

  # ============================================================================
  # Test Web Dashboard
  # ============================================================================
  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run linter
        working-directory: web
        run: npm run lint --if-present

      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  # ============================================================================
  # Build Docker Images
  # ============================================================================
  build-optimizer:
    name: Build Optimizer Image
    runs-on: ubuntu-latest
    needs: [test-optimizer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/optimizer
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: python-optimizer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: [test-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: [test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.STAGING_API_URL || 'https://api.kora.example.com' }}

  # ============================================================================
  # Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-optimizer, build-api, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd /opt/kora
            echo "Pulling latest images..."
            docker compose pull
            echo "Restarting services..."
            docker compose up -d --remove-orphans
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Staging deployment complete!"
          EOF

  # ============================================================================
  # Health Check
  # ============================================================================
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: [deploy-staging]

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check API health
        run: |
          HEALTH_URL="${{ vars.STAGING_API_URL || 'https://staging-api.example.com' }}/health"
          echo "Checking health at: $HEALTH_URL"
          curl -f "$HEALTH_URL" || echo "Health check endpoint not configured"

      - name: Check Optimizer health
        run: |
          HEALTH_URL="${{ vars.STAGING_OPTIMIZER_URL || 'https://staging-optimizer.example.com' }}/health"
          echo "Checking health at: $HEALTH_URL"
          curl -f "$HEALTH_URL" || echo "Health check endpoint not configured"

  # ============================================================================
  # Deploy to Production (manual approval required)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [health-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd /opt/kora
            echo "Creating backup before deploy..."
            ./scripts/backup.sh || true
            echo "Pulling latest images..."
            docker compose pull
            echo "Restarting services..."
            docker compose up -d --remove-orphans
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Production deployment complete!"
          EOF

      - name: Notify deployment success
        if: success()
        run: |
          echo "Production deployment successful!"
          # Add Slack/email notification here if needed

      - name: Production health check
        run: |
          sleep 30
          HEALTH_URL="${{ vars.PRODUCTION_API_URL || 'https://api.kora.example.com' }}/health"
          echo "Checking production health at: $HEALTH_URL"
          curl -f "$HEALTH_URL" || echo "Health check failed - investigate immediately!"
