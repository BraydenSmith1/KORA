# =============================================================================
# KORA Site Configuration Template
# Copy this file and customize for your microgrid
# =============================================================================

site_id: example-site
site_name: Example Microgrid
location: City, Country
timezone: UTC

# -----------------------------------------------------------------------------
# Battery Storage Configuration
# -----------------------------------------------------------------------------
battery:
  capacity_kwh: 100  # Total battery capacity in kWh
  power_kw: 50  # Max charge/discharge rate in kW
  soc_min_percent: 20  # Minimum state of charge (%)
  soc_max_percent: 95  # Maximum state of charge (%)
  efficiency_charge: 0.94  # Charging efficiency (0-1)
  efficiency_discharge: 0.94  # Discharging efficiency (0-1)
  cycle_cost_per_kwh: 0.01  # Degradation cost per kWh cycled

# -----------------------------------------------------------------------------
# Solar Array Configuration
# -----------------------------------------------------------------------------
solar:
  capacity_kw: 100  # Peak solar capacity in kWp
  daily_production_kwh: 450  # Expected daily production (for reference)

# -----------------------------------------------------------------------------
# Dynamic Pricing Configuration
# Adjust currency and values for your market
# -----------------------------------------------------------------------------
pricing:
  min_price: 0.10  # Minimum price per kWh
  max_price: 0.30  # Maximum price per kWh
  reference_price: 0.20  # Baseline/reference price per kWh
  currency: USD
  currency_symbol: $

# -----------------------------------------------------------------------------
# Demand Response Configuration
# -----------------------------------------------------------------------------
demand:
  elasticity: 0.6  # Price elasticity (0.4-0.8 typical)
  peak_load_kw: 50  # Peak demand in kW
  base_load_kw: 8  # Minimum always-on load in kW

# -----------------------------------------------------------------------------
# Grid Connection (set to true if grid-tied)
# -----------------------------------------------------------------------------
grid:
  connected: false
  # import_limit_kw: 50  # Max import from grid (if connected)
  # export_limit_kw: 50  # Max export to grid (if connected)
  # wholesale_price: 0.08  # Grid electricity cost per kWh

# -----------------------------------------------------------------------------
# Optimizer Settings
# -----------------------------------------------------------------------------
optimizer:
  horizon_hours: 24  # Optimization horizon
  timestep_hours: 1.0  # Time step duration
  solver: highs  # Solver: highs, cbc, glpk
  time_limit_sec: 60  # Max solver time
  curtailment_penalty: 0.15  # Penalty per kWh curtailed
  blackout_penalty: 0.50  # Penalty per kWh unmet demand

# -----------------------------------------------------------------------------
# Telemetry Configuration
# -----------------------------------------------------------------------------
telemetry:
  modbus_host: 127.0.0.1  # Modbus TCP host
  modbus_port: 502  # Modbus TCP port
  poll_interval_sec: 1.0  # Polling interval in seconds
  api_url: http://localhost:4000/api/ingest  # API endpoint
  # api_key: YOUR_API_KEY_HERE

# -----------------------------------------------------------------------------
# Alerting Configuration
# -----------------------------------------------------------------------------
alerts:
  # webhook_url: https://hooks.slack.com/...
  # email: alerts@example.com
  # sms_number: +1234567890
  alert_on_solver_failure: true
  alert_on_high_curtailment: true
  curtailment_threshold_percent: 20
